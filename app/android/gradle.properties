org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── R8 in full mode, stated rather than inherited ───────────────────────────
#
# The default since AGP 8, so this changes nothing today. It is written down
# because it is the difference between R8 behaving like ProGuard and R8
# behaving like R8 — full mode assumes classes are not reflected on unless a
# rule says so, which is what makes the narrowed keeps in
# `app/proguard-rules.pro` worth narrowing. A future AGP flipping the default
# back would silently undo that work.
android.enableR8.fullMode=true
