include: package:flutter_lints/flutter.yaml

analyzer:
  # ───────────────────────────────────────────────────────────────────────────
  #  Strict typing, turned on 23 September 2026, and it cost one line.
  #
  #  Without these three the analyzer accepts implicit `dynamic` silently: an
  #  untyped literal in one branch of a ternary degrades the whole expression,
  #  and every use of the result afterwards goes unchecked. That is how a type
  #  error becomes an apology screen on somebody's phone instead of a red line
  #  on this laptop.
  #
  #  They were enabled against the whole of `lib/` before being committed and
  #  the analyzer reported exactly **one** issue — `day_screen.dart`'s
  #  `const []`, fixed in the same commit. The codebase was already strict; it
  #  simply was not being checked. That is the whole argument for keeping them.
  # ───────────────────────────────────────────────────────────────────────────
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# ─────────────────────────────────────────────────────────────────────────────
#  The one lint this project turns off, and why.
#
#  `prefer_initializing_formals` wants `AttachmentStore({required this._sodium})`
#  instead of `({required SodiumSumo sodium}) : _sodium = sodium`. Obeying it
#  would put a **private identifier into a public constructor signature** — the
#  named argument at every call site becomes `_sodium:` — which is worse to read
#  and worse to document for the sake of one saved line.
#
#  It is off rather than ignored case by case because the 22 August audit found
#  the analyzer sitting at a dozen permanent suggestions, and the lesson of the
#  permanently red test suite applies here too: a warning list that is never
#  empty cannot report the thirteenth. Everything else stays on, and the
#  analyzer is at zero.
# ─────────────────────────────────────────────────────────────────────────────
linter:
  rules:
    prefer_initializing_formals: false
